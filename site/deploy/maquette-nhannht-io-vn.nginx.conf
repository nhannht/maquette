# maquette.nhannht.io.vn - Maquette macOS app marketing site (Vite static build)
# Deployed to /var/www/maquette.nhannht.io.vn on sg-hs (ns547299).
# TLS: `sudo certbot --nginx -d maquette.nhannht.io.vn` extends this block
# with the 443 server and a port-80 -> 443 redirect once DNS resolves here.
server {
    listen 80;
    listen [::]:80;
    server_name maquette.nhannht.io.vn;

    root /var/www/maquette.nhannht.io.vn;
    index index.html;

    # Vite content-hashed assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D models: correct MIME for GLB and USDZ (USDZ powers AR Quick Look on
    # iOS Safari), long cache. Filenames are stable per release.
    location /models/ {
        types {
            model/gltf-binary glb;
            model/vnd.usdz+zip usdz;
        }
        default_type application/octet-stream;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reference photos, renders, posters, OG image: long cache.
    location /img/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        try_files $uri =404;
    }

    # Single HTML entry. Unknown paths fall back to it (no client router, but
    # this avoids stray 404s on hash-anchor links).
    location / {
        try_files $uri /index.html;
    }
}
