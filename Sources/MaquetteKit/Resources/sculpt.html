<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #dfe3e8; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.min.js", "three/addons/": "./" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { USDZExporter } from "three/addons/exporters/USDZExporter.js";

const state = { ready: false, model: null };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3e8);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8d9199, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 4, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.7);
fill.position.set(-4, 2, -3);
scene.add(fill);

const VIEWS = {
  front:        new THREE.Vector3(0, 0.12, 1),
  threeQuarter: new THREE.Vector3(0.75, 0.45, 0.75),
  side:         new THREE.Vector3(1, 0.12, 0),
  top:          new THREE.Vector3(0.001, 1, 0.001),
};

function frame(viewName) {
  const box = new THREE.Box3().setFromObject(state.model);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const dist = (sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.15;
  const dir = VIEWS[viewName].clone().normalize();
  camera.position.copy(sphere.center).addScaledVector(dir, dist);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  camera.lookAt(sphere.center);
}

// Binary export travels to Swift as base64 in the JSON status string. Chunked
// because String.fromCharCode blows the argument limit on a whole mesh buffer.
function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  const CHUNK = 0x8000;
  let binary = "";
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

// Swift talks to this object via evaluateJavaScript. Every call returns a JSON
// string {ok, error?} so errors travel back to the loop instead of dying here.
window.maquette = {
  load(code) {
    try {
      if (state.model) { scene.remove(state.model); state.model = null; }
      const factory = new Function("THREE", '"use strict";\n' + code + "\nreturn buildModel(THREE);");
      const model = factory(THREE);
      if (!model || !model.isObject3D) throw new Error("buildModel(THREE) must return a THREE.Object3D");
      const box = new THREE.Box3().setFromObject(model);
      if (box.isEmpty()) throw new Error("model has no visible geometry");
      // A NaN box passes isEmpty() (NaN compares false) and then poisons the
      // camera framing, rendering blank from every view - catch it here so it
      // costs a free retry, not a paid review cycle (IMG3D-17).
      const bounds = [box.min.x, box.min.y, box.min.z, box.max.x, box.max.y, box.max.z];
      if (!bounds.every(Number.isFinite)) {
        throw new Error("model bounding box is not finite: some geometry has NaN or " +
          "Infinity vertex positions. Common cause: passing a 2D curve (EllipseCurve, " +
          "Shape) to TubeGeometry, which requires a 3D curve (e.g. CatmullRomCurve3), " +
          "or invalid geometry parameters.");
      }
      const size = box.getSize(new THREE.Vector3());
      if (Math.max(size.x, size.y, size.z) < 1e-6) {
        throw new Error("model is degenerately small: bounding box size is ~0");
      }
      state.model = model;
      scene.add(model);
      return JSON.stringify({ ok: true });
    } catch (err) {
      const detail = err && err.stack ? String(err) + "\n" + String(err.stack) : String(err);
      return JSON.stringify({ ok: false, error: detail.slice(0, 2000) });
    }
  },
  // Async: Swift must reach this through callAsyncJavaScript, not
  // evaluateJavaScript, which does not await the returned promise.
  async exportModel(format) {
    try {
      if (!state.model) throw new Error("no model loaded");
      // Exports read world matrices; the model may never have been framed.
      state.model.updateMatrixWorld(true);
      let buffer;
      if (format === "glb") {
        buffer = await new GLTFExporter().parseAsync(state.model, { binary: true });
      } else if (format === "usdz") {
        buffer = await new USDZExporter().parseAsync(state.model);
      } else {
        throw new Error("unknown format: " + format);
      }
      return JSON.stringify({ ok: true, data: toBase64(buffer) });
    } catch (err) {
      const detail = err && err.stack ? String(err) + "\n" + String(err.stack) : String(err);
      return JSON.stringify({ ok: false, error: detail.slice(0, 2000) });
    }
  },
  view(name) {
    try {
      if (!state.model) throw new Error("no model loaded");
      if (!VIEWS[name]) throw new Error("unknown view: " + name);
      frame(name);
      renderer.render(scene, camera);
      return JSON.stringify({ ok: true });
    } catch (err) {
      return JSON.stringify({ ok: false, error: String(err).slice(0, 2000) });
    }
  },
  ready() { return state.ready; },
};

renderer.render(scene, camera);
state.ready = true;
</script>
</body>
</html>
